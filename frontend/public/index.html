        <title>YABBAI — Autonomous Income Platform</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>

        <!--
        Two third-party scripts were removed from this template.

        1. https://assets.emergent.sh/scripts/emergent-main.js
           Legacy from Emergent hosting. The app runs on Render now, so it had no
           remaining purpose. Ad blockers block it, which is what produced the
           ERR_BLOCKED_BY_CLIENT errors and blank render on holders.yabbai.network.

        2. PostHog analytics with session_recording enabled.
           This file is shared by both builds, so it loaded on the public holder
           page AND the director console. Session recording captures mouse
           movement, clicks and page content and ships them to a third party —
           on a public token page that records every visitor, and on the console
           it records treasury and withdrawal screens. The project key was also
           committed in plain text.

        Neither is required for the app to function. If analytics are wanted back,
        add them deliberately: to the command build only, with session_recording
        disabled, and with the key supplied from an environment variable.
        -->
    </head>

        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
