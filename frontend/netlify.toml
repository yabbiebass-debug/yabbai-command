# YABBAI — Netlify deploy config
#
# IMPORTANT: token.yabbai.network and holders.yabbai.network must be TWO SEPARATE
# NETLIFY SITES, not two domain aliases on one site. Aliases on a single site serve
# the same bundle to both hostnames, which would ship the full command application
# to the public holder view and defeat the whole isolation model.
#
#   Site 1  token.yabbai.network    build: npm run build
#   Site 2  holders.yabbai.network  build: npm run build:holders
#
# Set REACT_APP_BACKEND_URL in each site's environment panel. Never commit it here —
# it differs per environment and this file is tracked.

[build]
  base    = "frontend"
  publish = "frontend/build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # react-scripts 5 treats warnings as errors when CI=true.
  CI = "false"

# Single-page app: every path resolves to the bundle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
# Applied to both builds. The CSP is deliberately tight: no external scripts, no
# framing, and connect-src limited to the hub API and Solana explorers.

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https:;
      connect-src 'self' https://yabbai.network https://api.jup.ag;
      frame-ancestors 'none';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests
    """

# Hashed build assets are immutable; the HTML shell must never be cached or a
# deploy will not take effect for returning visitors.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
