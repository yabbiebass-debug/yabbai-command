# Render Blueprint for YABBAI.
#
# Render dashboard -> Blueprints -> New Blueprint Instance -> point at this repo
# on branch main. It creates all three services with the settings below.
#
# MongoDB is not included: Render has no managed MongoDB. Create a free M0
# cluster at mongodb.com/atlas, allow 0.0.0.0/0 in network access (Render free
# instances have no static egress IP), and paste the connection string into
# MONGO_URL in the dashboard.
#
# Values marked `sync: false` are prompted for on first deploy and are never
# committed. Everything else is safe in this file: mint and treasury addresses
# are public on-chain.

# Services and the domains attached to them in the Render dashboard:
#
#   yabbai-api      -> api.yabbai.network      (FastAPI backend)
#   yabbai-token    -> token.yabbai.network    (director console, full build)
#   yabbai-holders  -> holders.yabbai.network  (public view, build:holders)
#
# All three build from the same repo on main. The console and the public view
# differ only in build command, and that difference is the whole isolation.

services:
  # == Backend API - api.yabbai.network ========================================
  - type: web
    name: yabbai-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    # 0.0.0.0 and $PORT are required - Render routes to the port it assigns.
    # --app-dir puts backend/ on sys.path so `revenue.*` imports resolve.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      # Secrets - set in the dashboard, never here.
      - key: MONGO_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      # Long random string. Same value goes in Stripe/Gumroad as the signing
      # secret. Without it, no income can be booked from any source.
      - key: WEBHOOK_SECRET
        sync: false

      - key: DB_NAME
        value: yabbai
      - key: HUB_AUTH_URL
        value: https://yabbai.network

      # Makes a fresh deploy self-configuring; the database starts empty and the
      # route that would seed the mint is director-only.
      - key: TOKEN_MINT
        value: FXzGbxw38xBzTdwRe4YoGBA9toWat4vSVvvAgN5Ljupx
      - key: TREASURY_WALLET
        value: HTN1fvHwbzKiMwh9YXZEe3eooiMdoCAs3TweWdiSZV5i

      # Tried in order when the primary refuses a method on plan grounds.
      - key: SOLANA_RPC_FALLBACKS
        value: https://api.mainnet-beta.solana.com,https://solana-rpc.publicnode.com,https://rpc.ankr.com/solana

      # Shares one token measurement across agents for this many seconds.
      # Uncached, 50 agents rate-limited Jupiter into a false DATA GAP.
      - key: TOKEN_MEASUREMENT_TTL
        value: "30"

      - key: SNAPSHOT_INTERVAL_SECONDS
        value: "300"
      - key: WEBHOOK_MAX_AGE_SECONDS
        value: "300"

      # Claim faucet. Off, deliberately, and not merely unset.
      #
      # The token is still on its launch bonding curve. Tokens given away get
      # sold, and selling into a curve pulls SOL back out of it — lowering market
      # cap and moving graduation further away. Measured 17 Aug: 0.23% of the way,
      # 998 SOL short, 8 buys and 0 sells so far. A thousand free-token wallets is
      # a thousand potential first sellers against that.
      #
      # Turn on after graduation, when a real pool exists. Stated here rather than
      # left absent so nobody later assumes it was forgotten.
      - key: FAUCET_ENABLED
        value: "false"
      - key: FAUCET_TOKENS_PER_CLAIM
        value: "1000"
      - key: FAUCET_MAX_CLAIMS
        value: "1000"

      # Buyback guards. The defaults are in backend/revenue/buyback_engine.py;
      # set these only to change them. Agents propose within these bounds and
      # cannot execute - every buy is signed by the operator's own wallet.
      - key: BUYBACK_MIN_RESERVE_SOL
        value: "0.05"     # never spend below this; fees still have to be payable
      - key: BUYBACK_MAX_FRACTION
        value: "0.25"     # ceiling per proposal, before risk/reinvest scaling
      - key: BUYBACK_MAX_IMPACT_PCT
        value: "5.0"      # refuse a quote that moves the price more than this
      - key: BUYBACK_COOLDOWN_MINUTES
        value: "60"       # minimum gap between proposals
      - key: BUYBACK_PROPOSAL_TTL_HOURS
        value: "6"        # expire a queued proposal rather than leave a stale quote

      # Never '*' while credentials are allowed. Only hosts that actually serve
      # the app: an origin left here after its service is gone is a credentialed
      # entry point aimed at a name nobody is watching.
      - key: CORS_ORIGINS
        value: https://yabbai.network,https://token.yabbai.network,https://holders.yabbai.network

  # == Director console - token.yabbai.network =================================
  - type: web
    name: yabbai-token
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/build
    envVars:
      # Must be a .yabbai.network host. The session cookie is scoped to that
      # parent domain, so pointing this at an onrender.com hostname means the
      # browser never sends it and every gated call returns 401.
      - key: REACT_APP_BACKEND_URL
        value: https://api.yabbai.network
      # react-scripts treats warnings as errors when CI is true, and Render
      # sets it.
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Mirrors the policy in frontend/netlify.toml, which applies only when
      # hosting on Netlify. Without this block a Render deploy served no CSP at
      # all, so the two hosts protected the same bundle very differently.
      #
      # connect-src lists api.yabbai.network explicitly. CSP host matching has no
      # implicit subdomain wildcard, so `https://yabbai.network` does NOT cover
      # `https://api.yabbai.network` — and REACT_APP_BACKEND_URL points at exactly
      # that. Omitting it blocks every API call the app makes.
      #
      # script-src stays 'self' with no 'unsafe-inline': the one inline script
      # this app had now lives in public/error-shim.js for precisely that reason.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://yabbai.network https://api.yabbai.network https://api.jup.ag; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

  # == Public holder view - holders.yabbai.network ==============================
  # build:holders is the entire isolation. Running the default build here would
  # publish the full console - auth, wallet signing, buybacks and all - to the
  # public URL. Verified: 230 KB with no admin markers, versus 1131 KB for the
  # console. tests/test_auth_surface.py covers the API side of the same boundary.
  - type: web
    name: yabbai-holders
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build:holders
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://api.yabbai.network
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Mirrors the policy in frontend/netlify.toml, which applies only when
      # hosting on Netlify. Without this block a Render deploy served no CSP at
      # all, so the two hosts protected the same bundle very differently.
      #
      # connect-src lists api.yabbai.network explicitly. CSP host matching has no
      # implicit subdomain wildcard, so `https://yabbai.network` does NOT cover
      # `https://api.yabbai.network` — and REACT_APP_BACKEND_URL points at exactly
      # that. Omitting it blocks every API call the app makes.
      #
      # script-src stays 'self' with no 'unsafe-inline': the one inline script
      # this app had now lives in public/error-shim.js for precisely that reason.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://yabbai.network https://api.yabbai.network https://api.jup.ag; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
